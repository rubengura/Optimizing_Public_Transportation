#
# Local environment for the CTA transit simulation:
#
# * A single-node Kafka broker in KRaft mode (ZooKeeper was removed in
#   Confluent Platform 8)
# * Schema Registry, REST Proxy and Kafka Connect (with the JDBC connector)
# * ksqlDB
# * A web UI to inspect topics, schemas, connectors and queries
# * PostgreSQL seeded with the CTA station table
#
# Every image is multi-arch (linux/amd64 and linux/arm64).
#

name: cta-transit

services:
  kafka:
    image: confluentinc/cp-kafka:8.3.2
    hostname: kafka
    ports:
    - "9092:9092"
    environment:
      # Replace with your own id: `kafka-storage random-uuid`. It is baked into
      # the metadata log, so changing it requires `docker compose down -v`.
      CLUSTER_ID: "${CLUSTER_ID:-4qX_flwRRQGrMeqHg468mQ}"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://kafka:19092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092"
      # INTERNAL is how the other containers reach the broker, EXTERNAL is how
      # the Python clients running on the host reach it.
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx768M"
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    hostname: schema-registry
    ports:
    - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:19092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx512M"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # Confluent Platform 8.3 images ship neither curl nor wget, but they do
      # carry python3. urlopen raises on any non-2xx, so this is a real HTTP
      # check rather than a bare port probe.
      test: ["CMD", "python3", "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  rest-proxy:
    image: confluentinc/cp-kafka-rest:8.3.2
    hostname: rest-proxy
    ports:
    - "8082:8082"
    environment:
      KAFKA_REST_HOST_NAME: "rest-proxy"
      KAFKA_REST_LISTENERS: "http://0.0.0.0:8082/"
      KAFKA_REST_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:19092"
      KAFKA_REST_SCHEMA_REGISTRY_URL: "http://schema-registry:8081/"
      KAFKAREST_HEAP_OPTS: "-Xmx512M"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8082/topics', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  connect:
    build: ./docker/connect
    image: cta-transit/kafka-connect:8.3.2
    hostname: connect
    ports:
    - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:19092"
      CONNECT_GROUP_ID: "connect"
      CONNECT_REST_ADVERTISED_HOST_NAME: "connect"
      # confluent-hub installs into /usr/share/confluent-hub-components, which
      # is not on the default plugin path.
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_CONFIG_STORAGE_TOPIC: "connect-config"
      CONNECT_OFFSET_STORAGE_TOPIC: "connect-offset"
      CONNECT_STATUS_STORAGE_TOPIC: "connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_HEAP_OPTS: "-Xmx768M"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8083/connectors', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  ksqldb:
    image: confluentinc/cp-ksqldb-server:8.3.2
    hostname: ksqldb
    ports:
    - "8088:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:19092"
      KSQL_LISTENERS: "http://0.0.0.0:8088"
      KSQL_HOST_NAME: "ksqldb"
      KSQL_KSQL_SERVICE_ID: "ksql_service_docker"
      KSQL_KSQL_SCHEMA_REGISTRY_URL: "http://schema-registry:8081/"
      KSQL_KSQL_CONNECT_URL: "http://connect:8083"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_HEAP_OPTS: "-Xmx768M"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8088/info', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    hostname: kafka-ui
    ports:
    # Host port is configurable: 8080 is a popular default and often taken.
    - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "cta"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:19092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "connect"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://connect:8083"
      KAFKA_CLUSTERS_0_KSQLDBSERVER: "http://ksqldb:8088"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17
    hostname: postgres
    ports:
    - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cta_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-chicago}"
      POSTGRES_DB: "${POSTGRES_DB:-cta}"
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./producers/data/cta_stations.csv:/tmp/cta_stations.csv:ro
    - ./load_stations.sql:/docker-entrypoint-initdb.d/load_stations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cta_admin} -d ${POSTGRES_DB:-cta}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  kafka-data:
  postgres-data:
