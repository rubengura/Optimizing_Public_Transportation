name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Catches newly published advisories against unchanged pins
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx install ruff==0.17.2
      - run: ruff check producers consumers

  # producers and consumers each own a top-level `models` package, so they get
  # one test suite each rather than a shared one.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [producers, consumers]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ${{ matrix.component }}
        run: pip install -r ${{ matrix.component }}/requirements.txt -r requirements-dev.txt
      - name: Test ${{ matrix.component }}
        working-directory: ${{ matrix.component }}
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [producers, consumers]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - name: Audit ${{ matrix.component }}
        run: pip-audit --strict -r ${{ matrix.component }}/requirements.txt

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yaml
        run: docker compose config -q

  # The only job that needs Docker. It brings up the real stack and checks the
  # bytes the producers put on the wire, which is what guards the Avro
  # serialization API against regressions.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Install producers
        run: pip install -r producers/requirements.txt -r requirements-dev.txt
      - name: Integration tests
        working-directory: producers
        run: pytest -m integration -q
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 80
