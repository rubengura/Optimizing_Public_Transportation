name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Catches newly published advisories against unchanged pins
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx install ruff==0.17.2
      - run: ruff check producers consumers

  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [producers, consumers]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - name: Audit ${{ matrix.component }}
        run: pip-audit --strict -r ${{ matrix.component }}/requirements.txt

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yaml
        run: docker compose config -q
